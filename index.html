<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <p>載入中...</p>
  <script>
    liff.init({ liffId: "2009932481-9GSDAunV" }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      liff.getProfile().then(profile => {
        const uid = profile.userId;
        const surveyUrl = "https://nestle.surveycake.biz/s/1yGA7";
        window.location.href = surveyUrl + "?aka_line_uid=" + uid;
      });
    });
  </script>
</body>
</html>
